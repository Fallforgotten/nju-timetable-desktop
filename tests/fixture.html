<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>纯虚构分页测试</title><style>body{font:16px sans-serif;padding:40px;color:#253e35}table{border-collapse:collapse;width:100%}td,th{border:1px solid #ccc;padding:10px}nav{margin-top:20px}</style><h1>虚构课程 · 桌面程序自检</h1><p>本页没有真实学校数据。</p><table><thead><tr><th>课程号</th><th>教学班名称</th><th>上课教师</th><th>时间地点</th><th>学年学期</th></tr></thead><tbody id="rows"></tbody></table><nav><span id="count"></span> 总页数 2 跳转: <input value="1" size="2"><button id="next" title="下一页">下一页</button></nav><script>
