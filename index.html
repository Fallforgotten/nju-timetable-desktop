<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"><title>南大课表导出助手</title><link rel="stylesheet" href="style.css"></head>
<body><aside><span class="eyebrow">蹭课网 · 桌面工具</span><h1>南大课表<br>导出助手 <small>v0.1.2</small></h1><p class="muted">无需安装插件，课程只导出到本机。</p>
<section><h2>1 · 打开学校页面</h2><button data-action="open">打开南大教务平台</button><button class="secondary" data-action="external">校外访问入口</button><p>自行登录后，选择<strong>学生组 → 全部课程</strong>，选择学期并搜索，回到第一页。</p></section>
<section><h2>2 · 检查并导出</h2><label for="term">学期无法识别时填写（可留空）</label><input id="term" maxlength="60" placeholder="2026-2027学年 第1学期"><button class="secondary" data-action="check">检查当前课表</button><button class="secondary" data-action="select-pager">指定下一页按钮</button><button class="secondary" data-action="cancel-pager">取消指定</button><button data-action="export" id="export" disabled>确认范围并导出全部</button><button class="secondary" data-action="stop" id="stop" hidden>停止导出</button><button class="secondary" data-action="save" id="save" hidden>保存导出结果 JSON</button></section>
<p id="status" role="status">打开学校页面后，按左侧步骤操作。</p>
<section><h2>3 · 导入蹭课网</h2><button class="secondary" data-action="import">打开蹭课网</button><p>在网页中选择刚保存的 JSON。程序不会自动上传文件。</p></section><footer>仅适配南京大学，非学校官方应用。登录信息不与其他浏览器共享；关闭程序后不保留登录会话。导出时请勿更改筛选或翻页。</footer></aside><script src="renderer.js"></script></body></html>
